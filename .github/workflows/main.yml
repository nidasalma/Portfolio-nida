name: Publish Quarto Website

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

     - name: Install R packages
  run: |
    Rscript -e 'install.packages(c("tidyverse", "ggplot2", "dplyr", "flextable", "rmarkdown"), repos="https://cloud.r-project.org")'

      - name: Render Quarto
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
